name: coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Calc coverage (library packages)
        run: |
          pkgs="$(go list ./... | grep -vE '/examples/|/cmd/' | tr '\n' ',')"
          go test -covermode=atomic -coverprofile=coverage.out -coverpkg="$pkgs" \
            $(go list ./... | grep -vE '/examples/|/cmd/')

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: coverage.out
          flags: unittests
          name: codecov-gorgonia
          fail_ci_if_error: false
          verbose: true
