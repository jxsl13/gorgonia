name: linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      # Cross-compile the library packages (no cgo). examples/cmd are skipped:
      # some use cgo (CBLAS) which cannot cross-compile without a cross C
      # toolchain. CUDA/BLAS code is build-tag gated (SPEC §C14); metal/coreml are
      # darwin&&arm64-gated and absent from a linux package list.
      # internal/asmcheck is test-only (arm64 parity tests) — excluded from the
      # build-only steps.
      - name: Cross-compile library (amd64/arm64 linux, amd64 darwin)
        run: |
          pkgs="$(go list ./... | grep -vE '/examples/|/cmd/|/asmcheck')"
          GOOS=linux  GOARCH=amd64 go build $pkgs
          GOOS=linux  GOARCH=arm64 go build $pkgs
          GOOS=darwin GOARCH=amd64 go build $pkgs

      - name: Test (race detector, library packages)
        run: go list ./... | grep -vE '/examples/|/cmd/' | xargs go test -race -timeout 20m

      # avx/sse are x86 SIMD tags (vendored vecf32/vecf64 amd64 asm). This runner
      # is amd64, so the native build exercises them.
      - name: Build with SIMD tags
        run: |
          pkgs="$(go list ./... | grep -vE '/examples/|/cmd/|/asmcheck')"
          go build -tags avx $pkgs
          go build -tags sse $pkgs
